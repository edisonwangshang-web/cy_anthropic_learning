<!doctype html>

<head>

  <title>Anthropic Engineering 中文精读摘要</title>
  <style>
    :root {
      --ink: #1f1f1d;
      --muted: #696964;
      --line: #deded9;
      --surface: #f7f7f5;
      --surface-strong: #ecece8;
      --accent: #11110f;
      --radius: 8px;
      color-scheme: light;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      background: #fff;
      color: var(--ink);
    }

    a {
      color: inherit;
    }

    button,
    input {
      font: inherit;
    }

    .skip-link {
      position: fixed;
      top: 8px;
      left: 8px;
      z-index: 20;
      padding: 8px 12px;
      transform: translateY(-150%);
      border-radius: 6px;
      background: var(--accent);
      color: #fff;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.96);
    }

    .topbar-inner {
      max-width: 1240px;
      min-height: 58px;
      margin: 0 auto;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .brand {
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      color: var(--muted);
      font-size: 13px;
    }

    .top-actions a {
      text-underline-offset: 3px;
    }

    .reader-shell {
      width: min(1240px, calc(100% - 48px));
      margin: 0 auto;
      padding: 36px 0 80px;
      display: grid;
      grid-template-columns: 280px minmax(0, 760px);
      gap: 64px;
      justify-content: center;
      align-items: start;
    }

    .article-index {
      position: sticky;
      top: 88px;
      max-height: calc(100vh - 112px);
      overflow: auto;
      padding-right: 12px;
    }

    .index-label,
    .eyebrow {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .search {
      width: 100%;
      height: 40px;
      margin: 12px 0 16px;
      padding: 0 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      outline: none;
      background: #fff;
      color: var(--ink);
    }

    .search:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--surface-strong);
    }

    .article-list {
      display: grid;
      gap: 2px;
    }

    .article-list a {
      padding: 9px 10px;
      border-radius: 6px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.4;
      text-decoration: none;
    }

    .article-list a:hover,
    .article-list a[aria-current="page"] {
      background: var(--surface);
      color: var(--ink);
    }

    .article-list a[hidden] {
      display: none;
    }

    .article-view {
      min-width: 0;
    }

    .translation-note {
      margin-bottom: 34px;
      padding: 14px 16px;
      border-left: 3px solid var(--ink);
      background: var(--surface);
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }

    .article-head {
      padding-bottom: 28px;
      border-bottom: 1px solid var(--line);
    }

    .article-head h1 {
      max-width: 720px;
      margin: 12px 0 0;
      font-size: 48px;
      line-height: 1.08;
      letter-spacing: 0;
    }

    .original-title {
      margin: 14px 0 0;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.5;
    }

    .meta-row {
      margin-top: 18px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tag {
      padding: 5px 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      color: var(--muted);
      font-size: 12px;
    }

    .article-intro {
      margin: 34px 0;
      color: #383835;
      font-size: 19px;
      line-height: 1.75;
    }

    .article-section {
      margin-top: 38px;
    }

    .article-section h2 {
      margin: 0 0 14px;
      font-size: 25px;
      line-height: 1.25;
      letter-spacing: 0;
    }

    .article-section p {
      margin: 0 0 16px;
      color: #383835;
      font-size: 16px;
      line-height: 1.85;
    }

    .terms {
      margin-top: 42px;
      padding: 20px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .terms h2 {
      margin: 0 0 12px;
      font-size: 16px;
    }

    .term-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .term-list span {
      padding: 6px 9px;
      border-radius: 6px;
      background: var(--surface);
      color: var(--muted);
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }

    .article-actions {
      margin-top: 28px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .button {
      min-height: 40px;
      padding: 8px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fff;
      color: var(--ink);
      font-size: 13px;
      font-weight: 650;
      text-decoration: none;
      cursor: pointer;
    }

    .button.primary {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }

    .article-pager {
      margin-top: 48px;
      padding-top: 20px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      border-top: 1px solid var(--line);
    }

    .pager-link {
      min-height: 72px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      border: 1px solid var(--line);
      border-radius: 6px;
      text-decoration: none;
    }

    .pager-link:last-child {
      text-align: right;
    }

    .pager-link small {
      color: var(--muted);
      font-size: 11px;
    }

    .pager-link b {
      margin-top: 4px;
      font-size: 13px;
    }

    .pager-link[hidden] {
      display: none;
    }

    @media (max-width: 860px) {
      .topbar-inner {
        padding: 0 16px;
      }

      .reader-shell {
        width: min(100% - 32px, 760px);
        padding-top: 22px;
        grid-template-columns: 1fr;
        gap: 30px;
      }

      .article-index {
        position: static;
        max-height: 280px;
        padding: 0 0 16px;
        border-bottom: 1px solid var(--line);
      }

      .article-head h1 {
        font-size: 36px;
      }
    }

    @media (max-width: 520px) {
      .top-actions a:first-child {
        display: none;
      }

      .article-pager {
        grid-template-columns: 1fr;
      }

      .pager-link:last-child {
        text-align: left;
      }

      .article-actions .button {
        width: 100%;
      }
    }

    html.embed .topbar,
    html.embed .skip-link,
    html.embed .article-index,
    html.embed .translation-note,
    html.embed .article-pager,
    html.embed #courseLink {
      display: none;
    }

    html.embed .reader-shell {
      width: 100%;
      margin: 0;
      padding: 28px 30px 64px;
      display: block;
    }

    html.embed .article-view {
      max-width: 700px;
      margin: 0 auto;
    }

    html.embed .article-head h1 {
      font-size: 36px;
    }

    @media (max-width: 520px) {
      html.embed .reader-shell {
        padding: 22px 18px 52px;
      }

      html.embed .article-head h1 {
        font-size: 32px;
      }
    }
  </style>
</head>

  <script>
    (() => {
      const embedded = new URLSearchParams(location.search).has("embed");
      if (embedded) document.documentElement.classList.add("embed");

      const articles = [
        {
          slug: "AI-resistant-technical-evaluations",
          title: "Designing AI-resistant technical evaluations",
          zh: "设计不容易被 AI 代做的技术评估",
          category: "评测与人才判断",
          level: "选读摘要",
          source: "https://www.anthropic.com/engineering/AI-resistant-technical-evaluations",
          intro: "当通用模型能够快速完成传统家庭作业和固定编程题时，招聘评估必须从“答案是否正确”转向“候选人如何理解问题、使用工具、验证结果并作出取舍”。",
          sections: [
            ["旧题为什么失效", ["许多 take-home 测试原本依靠时间压力和信息不完整来区分候选人，但 AI 可以生成结构完整、语法正确的答案。继续增加题目难度只会推动模型和候选人共同升级，不能恢复原来的区分度。", "真正的问题不是候选人是否使用 AI，而是测试是否仍然测到岗位所需的能力。"]],
            ["评估应该测什么", ["更可靠的评估接近真实工作：候选人需要澄清需求、解释假设、检查生成结果、处理失败情况，并对最终决定负责。观察过程、追问理由和要求现场修改，比检查一份静态答案更有价值。"]],
            ["课程中的用法", ["学习者也应按同一原则验收自己：不能把 AI 生成的文件当作掌握证据。需要口头解释、给出运行结果、指出风险，并能在条件变化时修改方案。"]]
          ],
          terms: ["take-home evaluation", "work sample", "process evidence", "AI-assisted work"]
        },
        {
          slug: "a-postmortem-of-three-recent-issues",
          title: "A postmortem of three recent issues",
          zh: "三起近期问题的事故复盘",
          category: "生产事故与治理",
          level: "阶段 6 必读",
          source: "https://www.anthropic.com/engineering/a-postmortem-of-three-recent-issues",
          intro: "用户感知到的“模型突然变差”不一定来自模型本身，也可能来自服务基础设施、路由、硬件差异或采样实现。文章用三起事故说明，质量也是需要像可用性一样监控的生产指标。",
          sections: [
            ["为什么问题难以发现", ["这些问题并不总会让服务直接报错。系统仍然返回答案，只是答案质量在某些模型、请求路径、硬件或上下文条件下下降。传统可用性监控看到的是“请求成功”，用户看到的却是“结果变差”。"]],
            ["复盘的共同模式", ["三起事件都暴露了覆盖不足：测试环境没有完整复现生产组合，局部改动通过了单点检查，却在路由、采样或不同硬件路径上产生偏差。多个小问题还可能叠加，使现象分散且难以稳定复现。"]],
            ["应该建立什么机制", ["发布前要覆盖不同模型、硬件、上下文长度和产品入口；发布后要用固定任务持续测量质量，并允许快速停止发布或回滚。用户报告必须进入可追踪的调查流程，不能只用“无法复现”结束。"]],
            ["对非程序员的启发", ["当产品结果下降时，不要只改提示词。先记录时间、输入、模型、环境、版本和输出证据，再检查最近变更。生产问题需要可观察性和变更记录，而不是猜测。"]]
          ],
          terms: ["postmortem", "regression", "sampling", "routing", "rollback"]
        },
        {
          slug: "advanced-tool-use",
          title: "Introducing advanced tool use on the Claude Developer Platform",
          zh: "Claude 开发者平台的高级工具使用",
          category: "工具与上下文",
          level: "选读摘要",
          source: "https://www.anthropic.com/engineering/advanced-tool-use",
          intro: "当 Agent 可用的工具从几个增长到几十或几百个时，把所有工具说明一次性放进上下文会造成浪费和选择错误。文章介绍按需发现、程序化调用和示例约束三类改进。",
          sections: [
            ["工具搜索", ["Tool Search 让模型先查找与当前任务相关的工具，只加载必要说明。这样既减少上下文占用，也降低名称相近工具之间的混淆。"]],
            ["程序化工具调用", ["Programmatic Tool Calling 允许模型通过代码组合多个工具、过滤中间结果，只把高价值结果带回上下文。它适合数据量大、步骤多、需要循环或条件判断的任务。"]],
            ["工具示例", ["Tool Use Examples 用具体输入输出告诉模型工具应该如何使用。对于参数复杂或边界容易混淆的工具，示例往往比增加抽象说明更有效。"]]
          ],
          terms: ["Tool Search", "Programmatic Tool Calling", "Tool Use Examples", "context efficiency"]
        },
        {
          slug: "april-23-postmortem",
          title: "An update on recent Claude Code quality reports",
          zh: "关于 Claude Code 近期质量反馈的更新",
          category: "生产事故与治理",
          level: "阶段 6 必读",
          source: "https://www.anthropic.com/engineering/april-23-postmortem",
          intro: "文章回应用户关于 Claude Code 质量下降的报告，并说明问题来自推理档位、思考缓存清理和系统提示变化等多个产品层因素，而不是一个单一故障。",
          sections: [
            ["用户报告为何重要", ["平均指标可能掩盖具体工作流中的退化。用户通常最先发现模型变得更急躁、遗漏验证或更容易结束任务，但这些感受必须转换成可复现输入、时间范围和版本信息。"]],
            ["多个变化如何叠加", ["推理 effort 的调整会改变模型愿意投入多少计算；thinking 缓存的处理会影响长对话连续性；系统提示的修改会改变工具使用和完成标准。单项变化看似合理，组合后却可能形成明显退化。"]],
            ["改进方向", ["团队需要更细粒度的质量监控、跨版本回归任务、受控发布和快速回滚。面向用户也要更透明地记录变化，让问题调查能够关联到具体版本。"]],
            ["课程中的检查方法", ["保留一次“黄金任务”的输入、预期结果和证据。每次更换模型、提示词或工具后重跑，比较功能、错误率和完成时间，而不是只凭主观印象。"]]
          ],
          terms: ["reasoning effort", "thinking cache", "system prompt", "quality regression"]
        },
        {
          slug: "building-c-compiler",
          title: "Building a C compiler with a team of parallel Claudes",
          zh: "让一组并行 Claude 构建 C 编译器",
          category: "Agent 架构与长任务",
          level: "选读摘要",
          source: "https://www.anthropic.com/engineering/building-c-compiler",
          intro: "这个实验让多个 Agent 并行开发一个复杂 C 编译器，用来观察长时间自治、多 Agent 协作、任务锁和测试系统如何共同决定结果。",
          sections: [

            ["测试是共同语言", ["Agent 之间不需要持续对话，只要都面向同一组可运行测试。测试结果提供环境事实，使工作可以被接力、合并和重新分配。"]],
            ["适用边界", ["多 Agent 更适合可以拆成相对独立模块、结果可自动验证的任务。高度耦合、验收模糊的工作会把协调成本放大。"]]
          ],
          terms: ["parallel agents", "task lock", "test harness", "merge conflict"]
        },
        {
          slug: "building-effective-agents",
          title: "Building effective agents",
          zh: "构建有效的 Agent",
          category: "Agent 架构与长任务",
          level: "阶段 1 必读",
          source: "https://www.anthropic.com/engineering/building-effective-agents",
          intro: "最成功的 Agent 系统通常不是最复杂的系统。文章建议从单次模型调用开始，只有在任务确实需要时，才逐步增加工作流、工具和自主决策。",
          sections: [
            ["工作流与 Agent 的区别", ["工作流（workflow）由预先写好的代码路径编排模型和工具，步骤更可预测；Agent 则由模型根据环境反馈动态决定下一步和工具使用。二者都属于 agentic systems，但控制权不同。"]],
            ["什么时候不要使用 Agent", ["Agent 通常用更高延迟和成本换取任务表现。固定、清晰、可拆解的任务优先使用简单调用、检索、示例或确定性工作流；只有步骤无法预先写死、需要灵活决策时，才值得增加自主性。"]],
            ["五种常见工作流", ["Prompt chaining 把任务串成固定步骤；Routing 按输入类型分流；Parallelization 并行处理独立子任务或进行多次投票；Orchestrator-workers 动态拆解并委派不可预知的子任务；Evaluator-optimizer 让生成者和评价者反复改进。"]],
            ["自主 Agent 如何工作", ["Agent 从用户目标出发，在工具调用和环境结果之间循环。关键不是让它一直思考，而是让它持续获得 ground truth，例如测试、执行结果或外部数据，并设置人工检查点和停止条件。"]],
            ["三个设计原则", ["保持结构简单；让计划和关键动作透明；像设计人机界面一样认真设计 Agent-computer interface。框架可以加速起步，但不能遮住提示词、工具和响应，否则系统会更难调试。"]]
          ],
          terms: ["workflow", "agent", "routing", "orchestrator-workers", "evaluator-optimizer", "ground truth"]
        },
        {
          slug: "claude-code-auto-mode",
          title: "How we built Claude Code auto mode: a safer way to skip permissions",
          zh: "Claude Code 自动模式：更安全地减少权限确认",
          category: "安全、权限与隔离",

      const renderIndex = () => {
        articleList.innerHTML = articles.map((article) => (
          `<a href="#${article.slug}" data-search="${`${article.zh} ${article.title} ${article.category}`.toLowerCase()}">${article.zh}</a>`
        )).join("");
      };

      const pagerMarkup = (label, article) => (
        `<small>${label}</small><b>${article.zh}</b>`
      );

      const renderArticle = (slug, focus = false) => {
        const index = Math.max(0, articles.findIndex((article) => article.slug === slug));
        const article = articles[index];
        document.title = `${article.zh} · Anthropic Engineering 中文精读摘要`;
        articleCategory.textContent = article.category;
        articleTitle.textContent = article.zh;
        originalTitle.textContent = article.title;
        articleLevel.textContent = article.level;
        articleIntro.textContent = article.intro;
        articleSections.innerHTML = article.sections.map(([heading, paragraphs]) => (
          `<section class="article-section"><h2>${heading}</h2>${paragraphs.map((paragraph) => `<p>${paragraph}</p>`).join("")}</section>`
        )).join("");
        articleTerms.innerHTML = article.terms.map((term) => `<span>${term}</span>`).join("");
        sourceLink.href = article.source;
        courseLink.href = `../Anthropic工程博客学习路径课程.html#${courseTargets[article.slug]}`;
        courseLink.textContent = article.level.includes("必读")
          ? "返回当前文章并继续练习"
          : "返回对应阶段继续学习";

        const previous = articles[index - 1];
        const next = articles[index + 1];
        previousArticle.hidden = !previous;
        nextArticle.hidden = !next;
        if (previous) {
          previousArticle.href = `#${previous.slug}`;
          previousArticle.innerHTML = pagerMarkup("上一篇", previous);
        }
        if (next) {
          nextArticle.href = `#${next.slug}`;
          nextArticle.innerHTML = pagerMarkup("下一篇", next);
        }

        articleList.querySelectorAll("a").forEach((link) => {
          if (link.getAttribute("href") === `#${article.slug}`) {
            link.setAttribute("aria-current", "page");
          } else {
            link.removeAttribute("aria-current");
          }
        });

        if (focus) {
          articleView.scrollIntoView({ behavior: "smooth", block: "start" });
          articleView.focus({ preventScroll: true });
        }
      };

      articleSearch.addEventListener("input", () => {
        const query = articleSearch.value.trim().toLowerCase();
        articleList.querySelectorAll("a").forEach((link) => {
          link.hidden = query && !link.dataset.search.includes(query);
        });
      });

      window.addEventListener("hashchange", () => {
        renderArticle(location.hash.slice(1), true);
      });

      if (embedded) {
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape") {
            window.parent.postMessage({ type: "close-article-drawer" }, "*");
          }
        });
      }

      renderIndex();
      renderArticle(location.hash.slice(1));
